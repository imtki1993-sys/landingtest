# Déploie le service de voix off darija (services/darija-tts) sur Modal, puis génère une voix de test.
# Lancement : onglet Actions → « Déployer la voix off darija » → Run workflow.
# Secrets du dépôt nécessaires : MODAL_TOKEN_ID, MODAL_TOKEN_SECRET, TTS_SERVICE_TOKEN.
name: Déployer la voix off darija

on:
  workflow_dispatch:
    inputs:
      test_text:
        description: "Phrase de test (darija, alphabet arabe)"
        required: false
        default: "واش عييتي من التيليفون اللي كيطيح ليك فالطوموبيل؟ هاد الحامل المغناطيسي كيشد التيليفون مزيان."
      test_voice:
        description: "Voix de test (doda-f1 … doda-f4, doda-m1 … doda-m3)"
        required: false
        default: "doda-f1"
      gpu:
        description: "Carte graphique Modal (T4 = moins chère, L4 / A10G = plus rapides)"
        required: false
        default: "T4"
        type: choice
        options: ["T4", "L4", "A10G"]

concurrency:
  group: deploy-tts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: services/darija-tts
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      TTS_SERVICE_TOKEN: ${{ secrets.TTS_SERVICE_TOKEN }}
      MODAL_GPU: ${{ inputs.gpu || 'T4' }}
    steps:
      - name: Vérifier les secrets
        working-directory: .
        run: |
          missing=""
          [ -n "$MODAL_TOKEN_ID" ] || missing="$missing MODAL_TOKEN_ID"
          case "$MODAL_TOKEN_ID" in ak-*|"") ;; *) echo "::warning::MODAL_TOKEN_ID devrait commencer par ak- (vérifie que les deux valeurs ne sont pas inversées)";; esac
          case "$MODAL_TOKEN_SECRET" in as-*|"") ;; *) echo "::warning::MODAL_TOKEN_SECRET devrait commencer par as- (vérifie que les deux valeurs ne sont pas inversées)";; esac
          [ -n "$MODAL_TOKEN_SECRET" ] || missing="$missing MODAL_TOKEN_SECRET"
          [ -n "$TTS_SERVICE_TOKEN" ] || missing="$missing TTS_SERVICE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants dans GitHub (Settings → Secrets and variables → Actions) :$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests du montage audio
        run: |
          pip install --quiet numpy
          python -m unittest test_audio_utils

      - name: Installer Modal
        run: pip install --quiet "modal>=1.0,<2"

      - name: Vérifier la connexion à Modal
        run: |
          if ! modal app list > modal-check.log 2>&1; then
            cat modal-check.log
            echo "::error::Modal refuse la connexion. Vérifie MODAL_TOKEN_ID (commence par ak-) et MODAL_TOKEN_SECRET (commence par as-) : modal.com → Settings → API Tokens → New Token, puis recopie-les dans les secrets GitHub, sans espace ni guillemet."
            exit 1
          fi
          echo "Connexion à Modal : OK"

      - name: "Déployer (1re fois ≈ 15-25 min, modèle marocain + 7 voix DODa)"
        run: |
          # la clé (sans espaces) est transmise au service par modal_app.py (Secret.from_dict)
          export TTS_SERVICE_TOKEN="$(printf %s "$TTS_SERVICE_TOKEN" | tr -d '[:space:]')"
          export BUILD_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Clé du service : ${#TTS_SERVICE_TOKEN} caractères, empreinte $(printf %s "$TTS_SERVICE_TOKEN" | sha256sum | cut -c1-8)"
          set +e
          modal deploy modal_app.py 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          set -e
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.modal\.run' deploy.log | head -1)
          if [ "$status" != "0" ] || [ -z "$url" ]; then
            # dernières lignes du déploiement, lisibles dans les annotations du lancement
            if grep -q "add a payment method" deploy.log; then
              echo "::error title=Moyen de paiement Modal::Modal demande un moyen de paiement pour la carte graphique $MODAL_GPU. modal.com → Settings → Usage and Billing → ajouter une carte (les crédits gratuits mensuels de Modal s'appliquent), puis relancer."
            fi
            tail_lines=$(grep -v '^\s*$' deploy.log | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Déploiement Modal (fin du journal)::${tail_lines}"
            exit 1
          fi
          echo "TTS_URL=$url" >> "$GITHUB_ENV"
          # conteneurs de l'ancienne version encore allumés : arrêtés, la prochaine demande démarre la nouvelle
          stopped=""
          for id in $(modal container list 2>/dev/null | grep -oE 'ta-[A-Za-z0-9]+' | sort -u); do
            modal container stop "$id" > /dev/null 2>&1 && stopped="$stopped $id"
          done
          echo "::notice title=Anciens conteneurs arrêtés::${stopped:- aucun}"
          # fin du journal en note (diagnostic sans télécharger les logs)
          tail_lines=$(grep -v '^\s*$' deploy.log | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Déploiement Modal (fin du journal)::${tail_lines}"
          modal app list 2>&1 | tail -8 | sed 's/%/%25/g' | awk 'BEGIN{printf "::notice title=Apps Modal::"} {printf "%s%%0A", $0} END{print ""}'

      - name: Tester une voix
        env:
          TEXT: ${{ inputs.test_text }}
          VOICE: ${{ inputs.test_voice }}
        run: |
          sent=$(printf %s "$TTS_SERVICE_TOKEN" | tr -d '[:space:]' | sha256sum | cut -c1-8)
          echo "Empreinte de la clé envoyée : $sent"
          for attempt in 1 2 3 4 5 6; do
            health=$(curl -sS --max-time 300 "$TTS_URL/health" || true)
            echo "health : $health"
            echo "$health" | grep -q "\"build\":\"${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"" && break
            sleep 20
          done
          python - <<'PY' > body.json
          import json, os, re
          text = os.environ["TEXT"].strip()
          sentences = [s.strip() for s in re.split(r"(?<=[.!؟?])\s+", text) if s.strip()]
          print(json.dumps({"sentences": sentences, "voice": os.environ["VOICE"] or "doda-f1"}, ensure_ascii=False))
          PY
          # nouvel essai : juste après un déploiement, l'ancienne version peut encore répondre quelques secondes
          for attempt in 1 2 3 4; do
            code=$(curl -sS --max-time 600 -X POST "$TTS_URL/synthesize" \
              -H "Authorization: Bearer $(printf %s "$TTS_SERVICE_TOKEN" | tr -d '[:space:]')" -H "Content-Type: application/json" \
              --data-binary @body.json -D headers.txt -o voix-test.mp3 -w '%{http_code}' || echo 000)
            echo "Essai $attempt : HTTP $code"
            [ "$code" = "200" ] && break
            head -c 300 voix-test.mp3; echo
            sleep 30
          done
          if [ "$code" != "200" ]; then
            msg="Le service répond HTTP $code."
            [ "$code" = "401" ] && msg="$msg Clé refusée (empreinte envoyée $sent ; service : $health)."
            echo "::error title=Test de voix::$msg $(head -c 200 voix-test.mp3 | tr -d '\n')"
            exit 1
          fi
          seconds=$(grep -i '^x-audio-seconds' headers.txt | tr -d '\r' | awk '{print $2}')
          echo "Voix de test : ${seconds:-?} s, $(stat -c %s voix-test.mp3) octets"
          echo "TEST_SECONDS=${seconds:-?}" >> "$GITHUB_ENV"

      - name: Voix de test à écouter
        uses: actions/upload-artifact@v4
        with:
          name: voix-test
          path: services/darija-tts/voix-test.mp3

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Voix off darija"
            if [ -n "$TTS_URL" ]; then
              echo "Service en ligne : \`$TTS_URL\`"
              echo
              echo "Dans **Vercel → Settings → Environment Variables** :"
              echo "- \`TTS_SERVICE_URL\` = \`$TTS_URL\`"
              echo "- \`TTS_SERVICE_TOKEN\` = la même clé que le secret GitHub \`TTS_SERVICE_TOKEN\`"
              echo
              echo "puis redéployer LandPro."
              [ -n "$TEST_SECONDS" ] && echo && echo "Voix de test : ${TEST_SECONDS} s (fichier **voix-test** ci-dessous, dans Artifacts)."
            else
              echo "Le déploiement n'a pas abouti : voir les étapes ci-dessus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
